# Helm Package Template
# Packages Helm charts and stores them in local repository

.package-helm-base:
  image: alpine/helm:${HELM_VERSION}
  before_script:
    - helm version
    - |
      export CHART_NAME="${CHART_NAME:-${CI_PROJECT_NAME}}"
      export CHART_VERSION="${CHART_VERSION:-${CI_COMMIT_TAG:-${CI_COMMIT_SHORT_SHA}}}"
      export PACKAGE_DIR="${PACKAGE_DIR:-helm-packages}"
      mkdir -p ${PACKAGE_DIR}
  script:
    - |
      echo "Packaging Helm chart: ${CHART_NAME}"
      
      # Package the chart
      helm package . --version ${CHART_VERSION} --app-version ${CHART_VERSION} -d ${PACKAGE_DIR}
      
      # Get the package filename
      PACKAGE_FILE=$(ls ${PACKAGE_DIR}/${CHART_NAME}-*.tgz | head -1)
      echo "Package created: ${PACKAGE_FILE}"
      
      # Validate the package
      helm lint ${PACKAGE_FILE} || exit 1
      
      echo "Chart packaged successfully"
  artifacts:
    paths:
      - ${PACKAGE_DIR}/*.tgz
    expire_in: 1 week
  only:
    - branches
    - tags

# Package Helm chart
package:helm:
  extends: .package-helm-base
  stage: build
  script:
    - |
      echo "Packaging Helm chart: ${CHART_NAME}"
      helm package . --version ${CHART_VERSION} --app-version ${CHART_VERSION} -d ${PACKAGE_DIR}
      PACKAGE_FILE=$(ls ${PACKAGE_DIR}/${CHART_NAME}-*.tgz | head -1)
      helm lint ${PACKAGE_FILE} || exit 1
      echo "Chart packaged: ${PACKAGE_FILE}"

# Package and update repository index
package:helm:index:
  extends: .package-helm-base
  stage: build
  script:
    - |
      echo "Packaging Helm chart: ${CHART_NAME}"
      helm package . --version ${CHART_VERSION} --app-version ${CHART_VERSION} -d ${PACKAGE_DIR}
      
      # Update or create index
      if [ -f "${HELM_REPO_DIR}/index.yaml" ]; then
        helm repo index ${HELM_REPO_DIR} --merge ${HELM_REPO_DIR}/index.yaml --url ${HELM_REPO_URL}
      else
        helm repo index ${HELM_REPO_DIR} --url ${HELM_REPO_URL}
      fi
      
      # Copy package to repo directory
      cp ${PACKAGE_DIR}/*.tgz ${HELM_REPO_DIR}/
      
      echo "Chart packaged and repository index updated"
  variables:
    HELM_REPO_DIR: "helm-repos/${CHART_CATEGORY:-platform}"
    HELM_REPO_URL: "${CI_REGISTRY}/helm-repos/${CHART_CATEGORY:-platform}"
