# Rollback Template
# Provides rollback capabilities for deployments

.rollback-base:
  image: alpine/helm:${HELM_VERSION}
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - |
      if [ -n "$KUBE_CONFIG" ]; then
        echo "$KUBE_CONFIG" | base64 -d > $HOME/.kube/config
        chmod 600 $HOME/.kube/config
      elif [ -n "$KUBE_SERVER" ] && [ -n "$KUBE_TOKEN" ]; then
        kubectl config set-cluster k8s --server=$KUBE_SERVER --insecure-skip-tls-verify=${KUBE_SKIP_TLS_VERIFY:-false}
        kubectl config set-credentials k8s --token=$KUBE_TOKEN
        kubectl config set-context k8s --cluster=k8s --user=k8s
        kubectl config use-context k8s
      fi
    - kubectl cluster-info || exit 1
  script:
    - |
      COMPONENT="${COMPONENT}"
      NAMESPACE="${KUBERNETES_NAMESPACE:-${KUBERNETES_NAMESPACE_PREFIX}-${COMPONENT}}"
      REVISION="${ROLLBACK_REVISION:-1}"
      
      echo "Rolling back ${COMPONENT} in namespace ${NAMESPACE} to revision ${REVISION}"
      
      # Get current revision
      CURRENT_REVISION=$(helm history ${COMPONENT} -n ${NAMESPACE} --output json | jq -r '.[0].revision' || echo "unknown")
      echo "Current revision: ${CURRENT_REVISION}"
      
      # List available revisions
      echo "Available revisions:"
      helm history ${COMPONENT} -n ${NAMESPACE} || true
      
      # Perform rollback
      helm rollback ${COMPONENT} ${REVISION} -n ${NAMESPACE} || exit 1
      
      # Wait for rollback to complete
      kubectl rollout status deployment/${COMPONENT} -n ${NAMESPACE} --timeout=${DEPLOY_TIMEOUT} || true
      
      echo "Rollback completed successfully"
  when: manual
  allow_failure: false

# Rollback jobs for each component type
rollback:cluster:cilium:
  extends: .rollback-base
  variables:
    COMPONENT: "cilium"
  environment:
    name: rollback/cluster/cilium
    action: rollback

rollback:monitoring:prometheus:
  extends: .rollback-base
  variables:
    COMPONENT: "prometheus"
  environment:
    name: rollback/monitoring/prometheus
    action: rollback

rollback:novaridium:postgresql:
  extends: .rollback-base
  variables:
    COMPONENT: "postgresql"
  environment:
    name: rollback/novaridium/postgresql
    action: rollback
